<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minuteur de devoir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1d2433; --muted:#6b7280; --line:#e4e0d6;
    --ok:#1f8a70; --warn:#e08a1e; --bad:#d23c3c; --accent:#2f5dd0;
    --ring:var(--ok); --vh:1vh;
  }
  @supports (height:100dvh){ :root{--vh:1dvh} }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
  button,input{font:inherit;color:inherit}
  .hidden{display:none !important}

  /* ---------- Réglages ---------- */
  #setup{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;
    width:min(560px,100%);box-shadow:0 10px 30px rgba(29,36,51,.06)}
  .card h1{margin:0 0 4px;font-size:28px}
  .card p.sub{margin:0 0 24px;color:var(--muted)}
  label.f{display:block;font-weight:700;margin:20px 0 8px}
  .txt{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:18px}
  .txt:focus{outline:none;border-color:var(--accent)}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:#efece4;border-radius:12px;padding:4px;gap:4px}
  .seg button{border:0;background:transparent;padding:10px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .row{display:flex;gap:12px;align-items:center;margin-top:12px}
  .row .txt{font-size:28px;text-align:center;font-variant-numeric:tabular-nums}
  .unit{color:var(--muted);font-size:18px;white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
  .chips button:hover{border-color:var(--accent)}
  .check{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--line);
    border-radius:14px;margin-top:12px;cursor:pointer;user-select:none}
  .check input{width:22px;height:22px;accent-color:var(--accent)}
  .check .mini{width:34px;height:34px;flex:none}
  .err{color:var(--bad);min-height:1.3em;margin-top:8px;font-size:15px}
  .go{width:100%;margin-top:18px;padding:16px;border:0;border-radius:14px;background:var(--accent);color:#fff;
    font-size:20px;font-weight:700;cursor:pointer}
  .go:hover{filter:brightness(1.08)}
  .hint{color:var(--muted);font-size:13px;margin-top:14px;text-align:center}

  /* ---------- Écran du devoir ---------- */
  #exam{height:100vh;height:100dvh;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
    padding:calc(2.2vh + env(safe-area-inset-top)) calc(3vw + env(safe-area-inset-right))
            calc(2.2vh + env(safe-area-inset-bottom)) calc(3vw + env(safe-area-inset-left))}
  #exam header{text-align:center;font-size:clamp(20px,3.6vh,44px);font-weight:700;min-height:1em}
  .stage{--s:min(calc(var(--vh)*100 - 220px),56vw);display:flex;align-items:center;justify-content:center;gap:3vw;min-height:0;overflow:hidden}
  .main{display:flex;align-items:center;justify-content:center;gap:5vw}
  .ringwrap{width:var(--s);height:var(--s);position:relative;flex:none}
  .ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
  .track{fill:none;stroke:#e6e2d8;stroke-width:7}
  .prog{fill:none;stroke:var(--ring);stroke-width:7;stroke-linecap:round;transition:stroke .6s, stroke-dashoffset .25s linear}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #digits{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;
    font-size:calc(var(--s) * .21);color:var(--ink)}
  #digits.long{font-size:calc(var(--s) * .155)}
  #state{margin-top:calc(var(--s) * .03);font-size:calc(var(--s) * .05);color:var(--muted);min-height:1.2em}

  .side{display:flex;flex-direction:column;gap:2.5vh;align-items:stretch;width:min(30vw,380px)}
  .calc{background:var(--card);border:3px solid var(--ok);border-radius:24px;padding:2.4vh 1.5vw;
    display:flex;flex-direction:column;align-items:center;gap:1.2vh;cursor:pointer;user-select:none;transition:border-color .3s}
  .calc.no{border-color:var(--bad)}
  .calc svg{width:min(19vh,15vw);height:min(19vh,15vw)}
  .calc .lbl{font-size:clamp(16px,3vh,34px);font-weight:700;text-align:center;line-height:1.15}
  .calc.yes .lbl{color:var(--ok)} .calc.no .lbl{color:var(--bad)}
  .info{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2vh 1.5vw;text-align:center}
  .info .k{color:var(--muted);font-size:clamp(13px,2vh,22px)}
  .info .v{font-size:clamp(22px,4.6vh,56px);font-weight:700;font-variant-numeric:tabular-nums}

  .bar{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;padding-top:1.5vh;transition:opacity .4s}
  .bar button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;
    font-size:17px;font-weight:700;cursor:pointer;min-width:58px}
  .bar button:hover{border-color:var(--accent)}
  .bar .sep{width:1px;background:var(--line);margin:0 6px}
  .bar .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .bar .minus{color:var(--bad)} .bar .plus{color:var(--ok)}
  .bar .danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
  body.idle .bar{opacity:0;pointer-events:none}
  body.idle{cursor:none}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}

  body.over #digits{color:var(--bad);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}

  @media (max-aspect-ratio: 1/1){
    .stage{--s:min(calc(var(--vh)*55 - 120px),86vw);flex-direction:column;gap:3vh}
    .main{flex-direction:column;gap:3vh}
    .side{flex-direction:row;align-items:flex-start;width:min(90vw,700px)}
    .side > *{flex:1}
    .calc svg{width:min(11vh,15vw);height:min(11vh,15vw)}
  }

  /* ----- Tables de multiplication ----- */
  #tables{display:none}
  body.tables #tables{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:calc(var(--vh)*1.2) .8vw;
    --tf:clamp(11px,min(calc(var(--vh)*2.3),1.1vw),28px);flex:1;min-width:0;align-content:center}
  .tb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.55em .4em .6em;font-size:var(--tf)}
  .tb h3{margin:0 0 .3em;text-align:center;font-size:1.05em;color:var(--accent)}
  .tbg{display:grid;grid-template-columns:repeat(5,auto);justify-content:center;column-gap:.35em;line-height:1.25;
    font-variant-numeric:tabular-nums}
  .tbg span:nth-child(5n+1),.tbg span:nth-child(5n+3),.tbg b{text-align:right}
  .tbg span:nth-child(5n+2),.tbg span:nth-child(5n+4){color:var(--muted)}
  .tbg b{font-weight:700}
  body.tables .stage{--s:min(calc(var(--vh)*100 - 430px),30vw);justify-content:space-between}
  body.tables .main{flex-direction:column;gap:calc(var(--vh)*2.5);flex:none}
  body.tables .side{flex-direction:row;align-items:stretch;width:max(var(--s),30vw);gap:1vw}
  body.tables .side > *{flex:1}
  body.tables .calc{padding:calc(var(--vh)*1.4) .6vw;gap:calc(var(--vh)*.6);border-radius:18px}
  body.tables .calc svg{width:min(calc(var(--vh)*9),6vw);height:min(calc(var(--vh)*9),6vw)}
  body.tables .calc .lbl{font-size:clamp(12px,calc(var(--vh)*2),22px)}
  body.tables .info{display:flex;flex-direction:column;justify-content:center;padding:calc(var(--vh)*1.2) .6vw;border-radius:18px}
  body.tables .info .v{font-size:clamp(14px,min(calc(var(--vh)*3.4),2.1vw),40px);white-space:nowrap}
  @media (max-aspect-ratio: 1/1){
    body.tables .stage{--s:min(calc(var(--vh)*24 - 30px),60vw);justify-content:safe center;gap:calc(var(--vh)*1.6)}
    body.tables .main{gap:calc(var(--vh)*1.6)}
    body.tables .side{width:min(90vw,700px)}
    body.tables .calc svg{width:calc(var(--vh)*5);height:calc(var(--vh)*5)}
    body.tables .info .v{font-size:clamp(16px,calc(var(--vh)*2.6),34px)}
    body.tables #tables{flex:none;width:100%;--tf:clamp(10px,min(calc(var(--vh)*1.2),2vw),22px)}
    .bar{gap:6px} .bar .sep{margin:0 2px}
    .bar button{padding:10px 11px;min-width:46px}
  }
  .bar button.on{background:#e8eefc;border-color:var(--accent)}

  /* Sur écran tactile : boutons plus grands, masquage moins rapide */
  @media (pointer: coarse){ .bar button{padding:12px 18px;font-size:19px} }
</style>
</head>
<body>

<!-- ======== RÉGLAGES ======== -->
<section id="setup">
  <div class="card">
    <h1>Minuteur de devoir</h1>
    <p class="sub">Réglez la durée ou l'heure de fin, puis lancez.</p>

    <label class="f" for="title">Titre affiché (facultatif)</label>
    <input id="title" class="txt" type="text" placeholder="Ex. : Évaluation n°3 – Fonctions affines">

    <label class="f">Mode</label>
    <div class="seg" role="tablist">
      <button id="mDur" class="on" type="button">Durée</button>
      <button id="mEnd" type="button">Heure de fin</button>
    </div>

    <div id="durBox">
      <div class="row">
        <input id="durH" class="txt" type="number" min="0" max="9" value="0" aria-label="Heures"><span class="unit">h</span>
        <input id="durM" class="txt" type="number" min="0" max="59" value="55" aria-label="Minutes"><span class="unit">min</span>
      </div>
      <div class="chips" id="presets">
        <button type="button" data-m="10">10 min</button>
        <button type="button" data-m="20">20 min</button>
        <button type="button" data-m="30">30 min</button>
        <button type="button" data-m="45">45 min</button>
        <button type="button" data-m="55">55 min</button>
        <button type="button" data-m="60">1 h</button>
        <button type="button" data-m="120">2 h</button>
      </div>
    </div>
    <div id="endBox" class="hidden">
      <div class="row"><input id="endT" class="txt" type="time" aria-label="Heure de fin"></div>
    </div>

    <label class="f">Consignes</label>
    <label class="check">
      <input id="calcOk" type="checkbox">
      <svg class="mini" viewBox="0 0 100 100" aria-hidden="true"><use href="#calcIcon"/></svg>
      <span>Calculatrice autorisée</span>
    </label>
    <label class="check">
      <input id="tablesOk" type="checkbox">
      <span style="font-size:22px;width:34px;text-align:center;font-weight:700">×</span>
      <span>Afficher les tables de multiplication (3 à 9, 11 et 12)</span>
    </label>
    <label class="check">
      <input id="soundOk" type="checkbox" checked>
      <span style="font-size:26px;width:34px;text-align:center">🔔</span>
      <span>Signal sonore à la fin</span>
    </label>

    <div class="err" id="err"></div>
    <button class="go" id="start" type="button">Lancer le devoir</button>
    <div class="hint">Raccourcis pendant le devoir : <b>Espace</b> pause · <b>F</b> plein écran · <b>↑ / ↓</b> ±1 min · <b>C</b> calculatrice · <b>T</b> tables</div>
  </div>
</section>

<!-- ======== DEVOIR ======== -->
<section id="exam" class="hidden">
  <header id="hTitle"></header>

  <div class="stage">
   <div class="main">
    <div class="ringwrap">
      <svg viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="45"/>
        <circle class="prog" id="prog" cx="50" cy="50" r="45"/>
      </svg>
      <div class="center">
        <div id="digits">00:00</div>
        <div id="state"></div>
      </div>
    </div>

    <div class="side">
      <div class="calc" id="calcCard" title="Cliquer pour changer">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <use href="#calcIcon"/>
          <g id="noMark">
            <circle cx="50" cy="50" r="44" fill="none" stroke="#d23c3c" stroke-width="8"/>
            <line x1="19" y1="81" x2="81" y2="19" stroke="#d23c3c" stroke-width="8" stroke-linecap="round"/>
          </g>
          <g id="yesMark">
            <circle cx="80" cy="80" r="17" fill="#1f8a70"/>
            <path d="M71 80l6 6 12-13" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
        <div class="lbl" id="calcLbl"></div>
      </div>
      <div class="info">
        <div class="k">Fin prévue</div>
        <div class="v" id="endShow">—</div>
      </div>
      <div class="info">
        <div class="k">Il est</div>
        <div class="v" id="nowShow">—</div>
      </div>
    </div>
   </div>
   <div id="tables" aria-label="Tables de multiplication"></div>
  </div>

  <div class="bar" id="bar">
    <button id="bPause" class="primary" type="button">Pause</button>
    <span class="sep"></span>
    <button class="minus" data-d="-5" type="button">−5</button>
    <button class="minus" data-d="-1" type="button">−1</button>
    <button class="plus"  data-d="1"  type="button">+1</button>
    <button class="plus"  data-d="5"  type="button">+5</button>
    <span class="sep"></span>
    <button id="bTables" type="button">× Tables</button>
    <button id="bFs" type="button">⛶ Plein écran</button>
    <button id="bReset" class="danger" type="button">Terminer</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<!-- Pictogramme calculatrice -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="calcIcon" viewBox="0 0 100 100">
    <rect x="25" y="12" width="50" height="76" rx="8" fill="#2b3446"/>
    <rect x="32" y="20" width="36" height="16" rx="3" fill="#cfe8d8"/>
    <g fill="#e9ecf2">
      <rect x="32" y="43" width="9" height="8" rx="2"/><rect x="45.5" y="43" width="9" height="8" rx="2"/><rect x="59" y="43" width="9" height="8" rx="2" fill="#f2b84b"/>
      <rect x="32" y="55" width="9" height="8" rx="2"/><rect x="45.5" y="55" width="9" height="8" rx="2"/><rect x="59" y="55" width="9" height="8" rx="2" fill="#f2b84b"/>
      <rect x="32" y="67" width="9" height="8" rx="2"/><rect x="45.5" y="67" width="9" height="8" rx="2"/><rect x="59" y="67" width="9" height="20" rx="2" fill="#f2b84b"/>
      <rect x="32" y="79" width="22.5" height="8" rx="2"/>
    </g>
  </symbol>
</svg>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MIN = 60000;
  const CIRC = 2 * Math.PI * 45;
  const prog = $('prog');
  prog.style.strokeDasharray = CIRC;

  let mode = 'dur';          // 'dur' | 'end'
  let endAt = null;          // timestamp de fin (si en cours)
  let pausedLeft = null;     // ms restants (si en pause)
  let total = 0;             // durée totale de référence pour l'anneau
  let calc = false, tables = false, sound = true, rang = false, timer = null;
  let audioCtx = null, wakeLock = null;

  /* ----- préférences locales ----- */
  const store = {
    get(){ try { return JSON.parse(localStorage.getItem('minuteurDevoir') || '{}'); } catch(e){ return {}; } },
    set(o){ try { localStorage.setItem('minuteurDevoir', JSON.stringify(o)); } catch(e){} }
  };
  const saved = store.get();
  if (saved.title) $('title').value = saved.title;
  if (saved.h != null) $('durH').value = saved.h;
  if (saved.m != null) $('durM').value = saved.m;
  if (saved.calc != null) $('calcOk').checked = saved.calc;
  if (saved.sound != null) $('soundOk').checked = saved.sound;
  if (saved.tables != null) $('tablesOk').checked = saved.tables;

  // heure de fin par défaut : maintenant + 55 min, arrondie à 5 min
  (() => { const d = new Date(Date.now() + 55*MIN); d.setMinutes(Math.ceil(d.getMinutes()/5)*5);
    $('endT').value = pad(d.getHours()) + ':' + pad(d.getMinutes()); })();

  function pad(n){ return String(n).padStart(2,'0'); }
  function hhmm(ts){ const d = new Date(ts); return d.getHours() + ' h ' + pad(d.getMinutes()); }
  function fmt(ms){
    const s = Math.max(0, Math.ceil(ms/1000));
    const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
    return h ? h + ':' + pad(m) + ':' + pad(x) : pad(m) + ':' + pad(x);
  }
  function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }

  /* ----- mode ----- */
  function setMode(m){
    mode = m;
    $('mDur').classList.toggle('on', m==='dur'); $('mEnd').classList.toggle('on', m==='end');
    $('durBox').classList.toggle('hidden', m!=='dur'); $('endBox').classList.toggle('hidden', m!=='end');
    $('err').textContent = '';
  }
  $('mDur').onclick = () => setMode('dur');
  $('mEnd').onclick = () => setMode('end');
  $('presets').onclick = e => {
    const m = +e.target.dataset.m; if (!m) return;
    $('durH').value = Math.floor(m/60); $('durM').value = m%60;
  };

  /* ----- lancement ----- */
  $('start').onclick = () => {
    let ms;
    if (mode === 'dur'){
      const h = parseInt($('durH').value,10) || 0, m = parseInt($('durM').value,10) || 0;
      ms = (h*60 + m) * MIN;
      if (ms <= 0){ $('err').textContent = 'Indiquez une durée supérieure à 0.'; return; }
    } else {
      const v = $('endT').value;
      if (!v){ $('err').textContent = 'Indiquez une heure de fin.'; return; }
      const [h,m] = v.split(':').map(Number);
      const d = new Date(); d.setHours(h, m, 0, 0);
      ms = d.getTime() - Date.now();
      if (ms <= 0){ $('err').textContent = 'Cette heure est déjà passée.'; return; }
    }
    calc = $('calcOk').checked; sound = $('soundOk').checked; tables = $('tablesOk').checked;
    store.set({ title:$('title').value, h:$('durH').value, m:$('durM').value, calc, sound, tables });

    total = ms; endAt = Date.now() + ms; pausedLeft = null; rang = false;
    $('hTitle').textContent = $('title').value.trim();
    renderCalc(); renderTables();
    $('setup').classList.add('hidden'); $('exam').classList.remove('hidden');
    document.body.classList.remove('over');
    if (sound) { try { audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); } catch(e){} }
    requestWake();
    clearInterval(timer); timer = setInterval(tick, 250); tick();
    armIdle();
  };

  /* ----- boucle ----- */
  function left(){ return pausedLeft != null ? pausedLeft : endAt - Date.now(); }
  function tick(){
    const l = left(), shown = Math.max(0,l);
    const d = $('digits'); d.textContent = fmt(shown);
    d.classList.toggle('long', shown >= 3600000);
    const frac = total > 0 ? Math.min(1, shown/total) : 0;
    prog.style.strokeDashoffset = CIRC * (1 - frac);

    const warn = Math.min(10*MIN, total*0.25), bad = Math.min(2*MIN, total*0.10);
    const col = shown <= bad ? 'var(--bad)' : shown <= warn ? 'var(--warn)' : 'var(--ok)';
    document.documentElement.style.setProperty('--ring', col);

    const over = l <= 0;
    document.body.classList.toggle('over', over);
    $('state').textContent = over ? 'Temps écoulé' : pausedLeft != null ? 'En pause' : '';
    $('endShow').textContent = pausedLeft != null ? '(en pause)' : hhmm(endAt);
    $('nowShow').textContent = hhmm(Date.now());

    if (over && !rang){ rang = true; if (sound) ring(); }
    if (!over) rang = false;
  }

  /* ----- commandes ----- */
  function togglePause(){
    if (pausedLeft == null){ pausedLeft = Math.max(0, endAt - Date.now()); $('bPause').textContent = 'Reprendre'; }
    else { endAt = Date.now() + pausedLeft; pausedLeft = null; $('bPause').textContent = 'Pause'; }
    tick();
  }
  function addMin(n){
    const delta = n*MIN;
    const cur = left();
    const nl = Math.max(0, cur + delta);
    const applied = nl - Math.max(0,cur);
    if (pausedLeft != null) pausedLeft = nl; else endAt = Date.now() + nl;
    total = Math.max(total + applied, nl, 1);
    toast((n>0?'+':'−') + Math.abs(n) + ' min');
    tick();
  }
  $('bPause').onclick = togglePause;
  document.querySelectorAll('.bar [data-d]').forEach(b => b.onclick = () => addMin(+b.dataset.d));

  function renderCalc(){
    const c = $('calcCard');
    c.classList.toggle('yes', calc); c.classList.toggle('no', !calc);
    $('noMark').style.display = calc ? 'none' : '';
    $('yesMark').style.display = calc ? '' : 'none';
    $('calcLbl').textContent = calc ? 'Calculatrice autorisée' : 'Calculatrice interdite';
  }
  $('calcCard').onclick = () => { calc = !calc; renderCalc(); };

  // Tables de multiplication
  (() => {
    const t = [3,4,5,6,7,8,9,11,12];
    $('tables').innerHTML = t.map(n => {
      let g = '';
      for (let k = 1; k <= 10; k++) g += `<span>${n}</span><span>×</span><span>${k}</span><span>=</span><b>${n*k}</b>`;
      return `<div class="tb"><h3>Table de ${n}</h3><div class="tbg">${g}</div></div>`;
    }).join('');
  })();
  function renderTables(){
    document.body.classList.toggle('tables', tables);
    $('bTables').classList.toggle('on', tables);
  }
  $('bTables').onclick = () => { tables = !tables; renderTables(); };

  // Terminer : double confirmation sans boîte de dialogue
  $('bReset').onclick = () => {
    const b = $('bReset');
    if (!b.classList.contains('armed')){
      b.classList.add('armed'); b.textContent = 'Confirmer ?';
      clearTimeout(b.t); b.t = setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Terminer'; }, 3000);
      return;
    }
    b.classList.remove('armed'); b.textContent = 'Terminer';
    clearInterval(timer); endAt = null; pausedLeft = null; $('bPause').textContent = 'Pause';
    document.body.classList.remove('over','idle','tables');
    $('exam').classList.add('hidden'); $('setup').classList.remove('hidden');
    exitFs(); releaseWake();
  };

  /* ----- plein écran ----- */
  function isFs(){ return document.fullscreenElement || document.webkitFullscreenElement; }
  function exitFs(){ try { if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch(e){} }
  $('bFs').onclick = toggleFs;
  function toggleFs(){
    if (isFs()) { exitFs(); return; }
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    try {
      const p = req && req.call(el);
      if (p && p.catch) p.catch(() => toast('Plein écran refusé ici : ouvrez la page dans son propre onglet'));
      if (!req) toast('Plein écran non disponible : utilisez F11');
    } catch(e){ toast('Plein écran non disponible : utilisez F11'); }
  }
  const fsLabel = () => $('bFs').textContent = isFs() ? '⛶ Quitter' : '⛶ Plein écran';
  document.addEventListener('fullscreenchange', fsLabel);
  document.addEventListener('webkitfullscreenchange', fsLabel);

  /* ----- masquage auto des boutons ----- */
  let idleT;
  function armIdle(){
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(() => { if (!$('exam').classList.contains('hidden')) document.body.classList.add('idle'); }, matchMedia('(pointer: coarse)').matches ? 8000 : 4000);
  }
  ['mousemove','mousedown','touchstart','keydown'].forEach(ev => document.addEventListener(ev, armIdle, {passive:true}));

  /* ----- clavier ----- */
  document.addEventListener('keydown', e => {
    if ($('exam').classList.contains('hidden')) {
      if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') $('start').click();
      return;
    }
    if (e.code === 'Space'){ e.preventDefault(); togglePause(); }
    else if (e.key === 'f' || e.key === 'F') toggleFs();
    else if (e.key === 'ArrowUp' || e.key === '+'){ e.preventDefault(); addMin(1); }
    else if (e.key === 'ArrowDown' || e.key === '-'){ e.preventDefault(); addMin(-1); }
    else if (e.key === 'c' || e.key === 'C'){ calc = !calc; renderCalc(); }
    else if (e.key === 't' || e.key === 'T'){ tables = !tables; renderTables(); }
  });

  /* ----- son ----- */
  function ring(){
    if (!audioCtx) return;
    try {
      const t0 = audioCtx.currentTime;
      [0, .45, .9].forEach(dt => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = 880;
        g.gain.setValueAtTime(0, t0+dt);
        g.gain.linearRampToValueAtTime(.35, t0+dt+.03);
        g.gain.exponentialRampToValueAtTime(.001, t0+dt+.4);
        o.connect(g).connect(audioCtx.destination); o.start(t0+dt); o.stop(t0+dt+.42);
      });
    } catch(e){}
  }

  /* ----- écran toujours allumé (si le navigateur le permet) ----- */
  async function requestWake(){ try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){} }
  function releaseWake(){ try { wakeLock && wakeLock.release(); wakeLock = null; } catch(e){} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && endAt) requestWake(); });

  renderCalc();
})();
</script>
</body>
</html>
